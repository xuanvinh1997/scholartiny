# Pilot model using the same 3:1 pattern and 32K vocabulary.
vocab_size: 32768
hidden_size: 512
num_hidden_layers: 12
intermediate_size: 1408
num_attention_heads: 8
num_key_value_heads: 2
layer_pattern: MMMA
ssm_backend: mamba2
state_size: 32
ssm_expand: 2
ssm_head_dim: 64
conv_kernel: 4
max_seq_len: 8192
loss_chunk_size: 256
